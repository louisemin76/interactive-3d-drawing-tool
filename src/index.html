<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Drawing Tool</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/svg+xml" href="/icon-Fence.svg">
</head>

<!-- Layout tour -->
<div class="tour-blocker"></div>
<div class="tour-spotlight"></div>

<section class="tour-card">
    <p class="tour-step">1 / 3</p>

    <h2 class="tour-title">Choose a Brush</h2>

    <p class="tour-text">
        Select a brush from the toolbar to create 3D objects.
    </p>

    <div class="tour-actions">
        <button class="tour-skip" type="button">
            Skip
        </button>

        <button class="tour-next" type="button">
            Next
        </button>
    </div>
</section>

<!-- Creation Guide -->
<div class="creation-guide hidden">
    <section class="creation-modal">
        <h2>How to Create</h2>

        <div class="creation-demos">
            <figure class="creation-demo">
                <video
                    src="/guide/draw-demo.mp4"
                    alt="Drawing a line to create objects"
                    autoplay
                    loop
                >
                </video>
                <figcaption>Draw a Line</figcaption>
            </figure>

            <figure class="creation-demo">
                <video
                    src="/guide/click-demo.mp4"
                    alt="Clicking to create an object"
                    autoplay
                    loop
                >
                </video>
                <figcaption>Click</figcaption>
            </figure>
        </div>

        <p class="creation-instruction">
            Draw a line or click on the ground to create objects.
        </p>

        <button class="creation-start" type="button">
            Start Creating
        </button>
    </section>
</div>

<body>
    <canvas class="webgl"></canvas>
    
    
    <button class="info-button" 
            type="button"
            aria-label="Open controls information"
            aria-expanded="false"
    >
            i
    </button>

    <aside class="info-panel" aria-hidden="true">
        <h2>Controls</h2>

        <div class="control-row">
            <span>Left Mouse Button</span>
            <span>Draw</span>
        </div>

        <div class="control-row">
            <span>Right Mouse Button</span>
            <span>Rotate</span>
        </div>

        <div class="control-row">
            <span>Middle Mouse Button</span>
            <span>Pan</span>
        </div>

        <div class="control-row">
            <span>Mouse Wheel</span>
            <span>Zoom</span>
        </div>
    </aside>

    <div class="bottom-toolbar">
        <div class="brush-group">
            <button class="brush-button" data-brush="fence">
                <img class="brush-icon fence-icon" src="/icon-Fence.svg" alt="Fence brush" />
            </button>
            <button class="brush-button" data-brush="grass">
                <img class="brush-icon grass-icon" src="/icon-Grass.svg" alt="Grass brush" />
            </button>
            <button class="brush-button" data-brush="stone">
                <img class="brush-icon stone-icon" src="/icon-Stone.svg" alt="Stone brush" />
            </button>
        </div>

        <div class="divider"></div>

        <button class="clear-button">CLEAR</button>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
